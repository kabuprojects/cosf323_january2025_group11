<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-cover bg-center" style="background-image: url('images/back2.jpg');">
    <div class="bg-[#462637] p-8 rounded-lg shadow-lg text-white text-center w-96">
        <h2 class="text-2xl font-semibold mb-4">Admin Login</h2>
        <form id="loginForm" action="login.php" method="POST" class="space-y-4">
            <input type="email" name="email" id="email" placeholder="Email" required
                   class="w-full p-3 rounded-lg border-none text-gray-900">
            <input type="password" name="password" id="password" placeholder="Password" required
                   class="w-full p-3 rounded-lg border-none text-gray-900">
            <span id="passwordError" class="text-red-400 text-sm"></span>
            <button type="submit" 
                    class="w-full p-3 bg-[#926e79] text-white rounded-lg hover:bg-[#DD88CF] transition">Login</button>
        </form>

        <!-- Register Button -->
        <p class="mt-4 text-sm">Don't have an account? 
            <a href="register.html" class="text-[#DD88CF] font-semibold hover:underline">Register</a>
        </p>
    </div>

    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
    event.preventDefault(); // Prevent default form submission

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    fetch("login.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
    })
    .then(response => response.text())
    .then(data => {
        console.log("Server Response:", data); // Debugging output
        if (data.trim() === "success") {
            window.location.href = "dashboard.html";
        } else {
            alert("Invalid email or password.");
        }
    })
    .catch(error => console.error("Error:", error));
});



// Login function
//

    </script>
</body>
</html>
