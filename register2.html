<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
    
    <form action="register_student.php" method="POST" class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-xl font-bold text-center mb-4 text-gray-800">Student Registration</h2>

        <label for="name" class="block font-semibold text-gray-700">Name:</label>
        <input type="text" id="name" name="name" required 
               class="w-full p-2 mb-4 border rounded-md focus:ring focus:ring-blue-300">

        <label for="regno" class="block font-semibold text-gray-700">Registration Number:</label>
        <input type="text" id="reg_number" name="regno" required 
               class="w-full p-2 mb-4 border rounded-md focus:ring focus:ring-blue-300">

        <label for="email" class="block font-semibold text-gray-700">Email:</label>
        <input type="email" id="email" name="email" required 
               class="w-full p-2 mb-4 border rounded-md focus:ring focus:ring-blue-300">

        <input type="hidden" id="face_encoding" name="face_encoding">

        <button type="submit" 
                class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">
            Register Student
        </button>
    </form>

</body>
</html>
