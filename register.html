<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-300">

    <div class="bg-gray-800 text-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-semibold text-center mb-6">Admin Registration</h2>

        <form action="register.php" method="POST" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium">Email:</label>
                <input type="email" name="email" required 
                       class="w-full px-4 py-2 mt-1 text-gray-900 rounded-md focus:ring focus:ring-blue-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium">Password:</label>
                <input type="password" name="password" required 
                       class="w-full px-4 py-2 mt-1 text-gray-900 rounded-md focus:ring focus:ring-blue-500">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-md transition duration-200">
                Register
            </button>
        </form>
    </div>

</body>
</html>
