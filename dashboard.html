<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            display: flex;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #ecf0f1;
        }
        .sidebar {
            width: 260px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            height: 100vh;
            position: fixed;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid #34495e;
            text-align: center;
            transition: 0.3s;
        }
        .sidebar ul li:hover {
            background: #1abc9c;
        }
        .content {
            margin-left: 280px;
            padding: 20px;
            width: calc(100% - 280px);
        }
        .chart-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        canvas {
            max-width: 350px;
            max-height: 350px;
        }
        .buttons {
            margin: 20px 0;
        }
        .btn {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            cursor: pointer;
            color: white;
            border-radius: 5px;
        }
        .btn-add { background: #3498db; }
        .btn-edit { background: #f1c40f; }
        .btn-delete { background: #e74c3c; }
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table, th, td {
            border: 1px solid #ddd;
            text-align: left;
            padding: 10px;
        }
        th {
            background: #34495e;
            color: white;
        }
        .class-attendance-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 50%;
            margin: auto;
            text-align: center;
        }
        .class-attendance-container h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn-container {
            margin-top: 15px;
        }
        .btn-start {
            background: #27ae60;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-start:hover {
            background: #2ecc71;
        }
        .btn-cancel {
            background: #e74c3c;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            transition: 0.3s;
        }
        .btn-cancel:hover {
            background: #c0392b;
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li onclick="showDashboard()">Dashboard</li>
            <li onclick="showAttendanceReport()">Attendance Reports</li>
            <li onclick="showManageStudents()">Manage Students</li>
            <li onclick="showClassAttendance()">Class Attendance</li>
        </ul>
    </div>
    <div class="content" id="main-content"></div>

    <script>
        function showDashboard() {
            document.getElementById('main-content').innerHTML = `
                <h2>Dashboard</h2>
                <div class="chart-container">
                    <canvas id='pieChart1'></canvas>
                    <canvas id='pieChart2'></canvas>
                </div>`;
            renderCharts();
        }

        function renderCharts() {
            fetch("http://127.0.0.1:5000/attendance_report")
                .then(response => response.json())
                .then(data => {
                    let presentCount = 0;
                    let absentCount = 0;

                    data.forEach(record => {
                        if (record.status === "Present") {
                            presentCount += record.count;
                        } else if (record.status === "Absent") {
                            absentCount += record.count;
                        }
                    });

                    let ctx1 = document.getElementById('pieChart1').getContext('2d');
                    new Chart(ctx1, {
                        type: 'pie',
                        data: {
                            labels: ['Present', 'Absent'],
                            datasets: [{
                                data: [presentCount, absentCount],
                                backgroundColor: ['#2ecc71', '#e74c3c']
                            }]
                        }
                    });

                })
                .catch(error => console.error('Error fetching attendance data:', error));
        }

        function showAttendanceReport() {
            document.getElementById('main-content').innerHTML = `
                <h2>Attendance Reports</h2>
                <canvas id='lineChart'></canvas>`;
            renderLineChart();
        }

        function renderLineChart() {
            let ctx = document.getElementById('lineChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                    datasets: [{
                        label: 'Attendance Rate',
                        data: [90, 85, 88, 92],
                        borderColor: '#1abc9c',
                        borderWidth: 2
                    }]
                }
            });
        }

        function showManageStudents() {
            document.getElementById('main-content').innerHTML = `
                <h2>Manage Students</h2>
                <div class="buttons">
                    <a href="register2.html" class="btn btn-add">Add Student</a>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Registration Number</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-table-body">
                            <!-- Data will be inserted here -->
                        </tbody>
                    </table>
                </div>`;
            fetch('fetch_students.php')
                .then(response => response.json())
                .then(data => {
                    let tableBody = document.getElementById('students-table-body');
                    tableBody.innerHTML = "";

                    data.forEach(student => {
                        let row = `<tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.reg_number}</td>
                            <td>${student.email}</td>
                            <td>
                                <button class="btn btn-edit" onclick="editStudent(${student.id}, '${student.name}', '${student.reg_number}', '${student.email}')">Edit</button>
                                <button class="btn btn-delete" onclick="deleteStudent(${student.id})">Delete</button>
                            </td>
                        </tr>`;
                        tableBody.innerHTML += row;
                    });
                })
                .catch(error => console.error('Error fetching student data:', error));
        }

        function showClassAttendance() {
            document.getElementById('main-content').innerHTML = `
                <div class="class-attendance-container">
                    <h2>Class Attendance</h2>
                    <div class="form-group">
                        <label for="unitName">Unit Name:</label>
                        <input type="text" id="unitName" placeholder="Enter Unit Name">
                    </div>
                    <div class="form-group">
                        <label for="date">Date:</label>
                        <input type="date" id="date">
                    </div>
                    <div class="form-group">
                        <label for="time">Time:</label>
                        <input type="time" id="time">
                    </div>
                    <p id="status"></p>
                    <div class="btn-container">
                        <button class="btn-start" onclick="startAttendance()">Start Attendance</button>
                        <button class="btn-cancel">Cancel</button>
                    </div>
                </div>`;
        }

        function startAttendance() {
            let unit = document.getElementById('unitName').value;
            let time = document.getElementById('time').value;
            let date = document.getElementById('date').value;
            let statusText = document.getElementById('status');

            if (!unit || !time || !date) {
                statusText.innerText = "All fields are required!";
                return;
            }

            statusText.innerText = "Starting attendance... Please wait.";

            fetch("http://127.0.0.1:5000/start_attendance", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ unit, time, date })
            })
            .then(response => response.json())
            .then(data => {
                statusText.innerText = data.message;
            })
            .catch(error => {
                statusText.innerText = "Error starting attendance.";
                console.error('Error:', error);
            });
        }

        showDashboard(); // Load the dashboard by default
    </script>
</body>
</html>
